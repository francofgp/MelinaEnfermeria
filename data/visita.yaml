# "Cómo es una visita": lo usan la landing y la pieza `visita`. Cuatro pasos, de oscuro a claro.
- nombre: Me escribís
  texto: Por WhatsApp me contás qué necesitás y me mandás una foto de la receta o la indicación del médico.
- nombre: Coordinamos
  texto: Acordamos día, horario y dirección. Te paso el valor antes de confirmar, así no hay sorpresas.
- nombre: Voy a tu casa
  texto: Llevo los descartables, jeringas, agujas, gasas y guantes. El medicamento lo tenés vos.
- nombre: Seguimos
  texto: Si el tratamiento lleva varias dosis o curaciones, dejamos agendada la próxima. Si veo algo raro, te lo digo para que consultes a tu médico.
