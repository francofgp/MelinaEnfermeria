# Preguntas frecuentes de la landing. `pendiente` marca la respuesta como dato a confirmar.
- pregunta: ¿Necesito receta?
  respuesta: Sí, para cualquier medicación o inyectable. Mandame una foto cuando me escribas y la reviso antes de ir.
- pregunta: ¿Llevás los materiales?
  respuesta: Llevo jeringas, agujas, gasas, guantes y lo necesario para la curación. El medicamento lo comprás vos en la farmacia.
- pregunta: ¿Cuánto cuesta?
  respuesta: Depende de la prestación y de la distancia. Te paso el valor por WhatsApp antes de confirmar la visita.
- pregunta: ¿Atendés urgencias?
  respuesta: No. Si es una urgencia, llamá al 107 o andá a la guardia más cercana.
- pregunta: ¿Hacés cuidados por horas?
  respuesta: Según mis horarios. Escribime con los días y las horas que necesitás y lo vemos.
- pregunta: ¿Trabajás con obra social?
  respuesta: Atiendo de forma particular.
  agregado: comprobante
- pregunta: ¿Cómo se paga?
  agregado: pagos
